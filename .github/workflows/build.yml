name: Build

# Läuft bei jedem Push auf main (Test-APK) und bei einem Tag wie "1.0" (signierte APK + AAB als Release).
on:
  push:
    branches: [main]
    tags: ['[0-9]*']
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Signierung (optional): ohne Schlüssel wird mit der Debug-Signatur gebaut
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version setzen
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Keystore bereitstellen
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Bauen
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Dateien umbenennen
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Planung.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/Planung.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Planung
          path: dist/*

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true # Entwurf: nur für Mitarbeiter am Repo sichtbar, veröffentlichen per Knopfdruck
          files: |
            dist/Planung.apk
            dist/Planung.aab
